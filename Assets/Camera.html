<!DOCTYPE html>
<html>
  <head>
    <style>
      .ErrorMessage{
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      font-size: xx-large;
      display: none;
      color:white;
      }
      body{
      background-color: black;
      }
      * {
      margin: 0;
      padding: 0;
      }
      .imgbox {
      display: grid;
      height: 100%;
      }
      .center-fit {
      max-width: 100%;
      max-height: 100vh;
      margin: auto;
      }
    </style>
  </head>
  <body>
    <script>
      function NoCameraFound(){
      document.getElementById("ErrorMessage").style.display = "block";
      }

      function CameraFound(){
      document.getElementById("ErrorMessage").style.display = "none";
      }

      window.addEventListener('load', (event) =>{
      var url_string = window.location.href;
      var url = new URL(url_string);
      var camera_adress= url.searchParams.get("camera");

      document.getElementById("camera").src = camera_adress;
      });
    </script>

    <div class="imgbox">
      <img id="camera" class="center-fit" src="" alt="" onload="CameraFound();" onerror="NoCameraFound();"></img>
    </div>
    <h1 class="ErrorMessage" id="ErrorMessage"> Error: couldn't connect to camera. </h1>

  </body>
</html>
